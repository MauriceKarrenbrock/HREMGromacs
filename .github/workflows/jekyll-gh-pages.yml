# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # conda-incubator/setup-miniconda needs a login shell so that
    # `conda activate` works in every subsequent step
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniforge (conda + mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: HREMGromacs
          use-mamba: true

      # Same cache key as the testing workflow, so the two workflows
      # share the (very heavy) conda environment instead of each building it.
      # sphinx autodoc imports HREMGromacs, so the full environment is needed.
      - name: Set cache date
        run: echo "DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: Cache conda environment
        id: cache-conda-env
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs/HREMGromacs
          key: conda-env-${{ runner.os }}-${{ hashFiles('environment.yml') }}-${{ env.DATE }}

      - name: Install dependencies
        if: steps.cache-conda-env.outputs.cache-hit != 'true'
        run: mamba env update --name HREMGromacs --file environment.yml

      - name: Make docs
        run: |
          python -m pip install -r doc-requirements.txt
          cd docs
          make html
          cp -a build/html/. .
          mv _static static
          sed -i "s/_static/static/g" *.html *.inv *.js
          sed -i "s/_static/static/g" _apidocs/*
          mv _sphinx_design_static/ sphinx_design_static/
          sed -i "s/_sphinx_design_static/sphinx_design_static/g" *.html *.inv *.js
          sed -i "s/_sphinx_design_static/sphinx_design_static/g" _apidocs/*
          mv _apidocs/ apidocs/
          sed -i "s/_apidocs/apidocs/g" *.html *.inv *.js
          cd ..

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs/
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    # Pull requests only build the docs (to check they still build),
    # only pushes to master / manual runs actually deploy them
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
