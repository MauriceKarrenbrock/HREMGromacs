name: Python Package using Conda

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
    # conda-incubator/setup-miniconda needs a login shell so that
    # `conda activate` works in every subsequent step
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Miniforge (conda + mamba)
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: HREMGromacs
        use-mamba: true

    # The environment is only rebuilt when environment.yml changes (or once
    # per day, to still pick up upstream updates). This is what avoids
    # rebuilding the (very heavy) conda environment on every single run.
    - name: Set cache date
      run: echo "DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

    - name: Cache conda environment
      id: cache-conda-env
      uses: actions/cache@v4
      with:
        path: ${{ env.CONDA }}/envs/HREMGromacs
        key: conda-env-${{ runner.os }}-${{ hashFiles('environment.yml') }}-${{ env.DATE }}

    - name: Install dependencies
      if: steps.cache-conda-env.outputs.cache-hit != 'true'
      run: mamba env update --name HREMGromacs --file environment.yml

    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: pytest
